name: End-to-end tests

on:
  push:
    branches:
      - master
      - "security/**"
  pull_request:
    branches:
      - master
      - "security/hardening-2026"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox:
    name: Browser tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run Firefox desktop and responsive tests
        run: npx playwright test --project="Firefox Desktop" --project="Firefox Responsive"
      - name: Upload Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-firefox-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  chromium:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
