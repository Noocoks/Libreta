name: Validación de calidad

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar integridad del proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar JSON, rutas locales, árbol y Python
        run: python scripts/validate_project.py

      - name: Comprobar sintaxis JavaScript
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Comprobando $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
