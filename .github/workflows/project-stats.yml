name: Actualizar estadísticas del proyecto

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Ningún permiso se concede globalmente.
permissions: {}

concurrency:
  group: project-stats
  cancel-in-progress: false

jobs:
  update-stats:
    name: Recalcular líneas de código
    runs-on: ubuntu-latest
    # La escritura solo se permite en master, también en ejecuciones manuales.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Calcular estadísticas
        run: python scripts/update_project_stats.py

      - name: Guardar estadísticas actualizadas
        run: |
          if git diff --quiet -- res/json/project-stats.json; then
            echo "Las estadísticas ya están actualizadas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/json/project-stats.json
          git commit -m "chore: actualizar estadísticas del proyecto"
          git push
