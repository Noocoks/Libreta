name: Actualizar estadísticas del proyecto

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Ningún permiso se concede globalmente.
permissions: {}

concurrency:
  group: project-stats
  cancel-in-progress: false

jobs:
  update-stats:
    name: Recalcular líneas de código
    runs-on: ubuntu-latest
    outputs:
      pr_operation: ${{ steps.create-pr.outputs.pull-request-operation }}
      pr_branch: ${{ steps.create-pr.outputs.pull-request-branch }}
    # Solo recalcula en master y propone el resultado mediante PR; nunca hace push directo a master.
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Calcular estadísticas
        run: python scripts/update_project_stats.py

      - name: Crear PR con estadísticas actualizadas
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: res/json/project-stats.json
          commit-message: "chore: actualizar estadísticas del proyecto"
          title: "chore: actualizar estadísticas del proyecto"
          body: "Actualización automática de las estadísticas del repositorio. Se integra mediante pull request para respetar la protección de master."
          branch: automation/project-stats
          delete-branch: true
          base: master

  dispatch-checks:
    name: Ejecutar controles de la PR automática
    needs: update-stats
    if: needs.update-stats.outputs.pr_operation == 'created' || needs.update-stats.outputs.pr_operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Lanzar Quality checks, E2E y CodeQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ needs.update-stats.outputs.pr_branch }}
        run: |
          gh workflow run quality-checks.yml --repo "$GH_REPO" --ref "$PR_BRANCH"
          gh workflow run e2e-tests.yml --repo "$GH_REPO" --ref "$PR_BRANCH"
          gh workflow run codeql.yml --repo "$GH_REPO" --ref "$PR_BRANCH"
