name: Quality checks

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Denegar todos los permisos por defecto; cada job declara solo los necesarios.
permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Validate every JSON file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Validate tree routes, local links and Python syntax
        run: python scripts/validate_project.py

      - name: Validate CSS resources and HTML fragments
        run: python scripts/validate_assets.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)

      - name: Run Python unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Install actionlint and zizmor (verified release archives)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install /tmp/actionlint /usr/local/bin/actionlint

          curl --fail --silent --show-error --location \
            https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/zizmor.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  /tmp/zizmor.tar.gz" | sha256sum --check
          mkdir -p /tmp/zizmor
          tar -xzf /tmp/zizmor.tar.gz -C /tmp/zizmor
          sudo install /tmp/zizmor/zizmor /usr/local/bin/zizmor

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Audit GitHub Actions security
        run: zizmor .github/workflows
