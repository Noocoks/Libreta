name: Quality checks

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Denegar todos los permisos por defecto; cada job declara solo los necesarios.
permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Validate every JSON file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Validate tree routes, local links and Python syntax
        run: python scripts/validate_project.py

      - name: Validate CSS resources and HTML fragments
        run: python scripts/validate_assets.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
